<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MQ</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MQ"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0B0C"><link rel="apple-touch-icon" sizes="180x180" href="icon.png"><link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--hdr:#111113;--tx:#FFFFFF;--mut:#9A9AA0;--ac:#E0A43A}
html,body{margin:0;height:100%;background:var(--hdr);touch-action:manipulation;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--tx)}
/* full-bleed frame inset by the safe areas (env() is 0 inside the iframe, so the outer page pads) */
#app{position:fixed;top:env(safe-area-inset-top);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0;background:var(--bg);touch-action:manipulation}
#splash{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px max(28px,env(safe-area-inset-right)) 32px max(28px,env(safe-area-inset-left));transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:230px;height:230px}
#gate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);padding:24px;text-align:center;z-index:6}
#gate.show{display:flex}#gate img{width:120px;height:120px}#gate p{color:var(--mut);margin:0;max-width:300px;font-size:15px;line-height:1.45}
#gate a{background:var(--ac);color:#000;font-weight:700;font-size:17px;text-decoration:none;border-radius:12px;padding:14px 28px;min-height:44px;box-sizing:border-box}
</style>
</head><body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbx8XWIiHerhRll_alm0B5ziQAN3TGxC3PLDVp5RCyq9PqcS3odJ64XV5-2cneIHVe5mLg/exec" allow="clipboard-write" title="MQ 2027 Master Dashboard"></iframe>
<div id="splash" role="status" aria-label="Loading"><div class="wl" id="wl"><img src="logo.png" alt="MQ"></div></div>
<script>/* MQ barbed-wire splash: hourglass pinch (strips) + cinching barbed wire. Transforms only. */
(function(){
var host=document.getElementById('wl');if(!host)return;
var img=host.querySelector('img');var src=img&&img.getAttribute('src');if(!src)return;
var S=230,N=80,h=S/N,D=2.2,MIN=0.6,MID=0.8;
var q=(location.search.match(/[?&]wt=([\d.]+)/)||[])[1];var T=q!=null?parseFloat(q):null;
function prof(d){return 1-(1-MIN)*Math.exp(-Math.pow(d/0.42,2))+0.035*Math.pow(Math.abs(d),3);}
var css='.wl{position:relative;width:'+S+'px;height:'+S+'px}.wl>img{display:none}'+
'.wst{position:absolute;left:0;width:'+S+'px;background:url("'+src+'") no-repeat;background-size:'+S+'px '+S+'px;transform-origin:50% 50%;will-change:transform;backface-visibility:hidden;animation:'+D+'s cubic-bezier(.45,0,.25,1) 1 both}'+
'.wwr{position:absolute;left:50%;top:50%;width:'+(S*200/132).toFixed(1)+'px;height:'+(S*80/132).toFixed(1)+'px;margin:'+(-S*40/132).toFixed(1)+'px 0 0 '+(-S*100/132).toFixed(1)+'px;overflow:visible;pointer-events:none;transform-origin:50% 50%;will-change:transform;animation:'+D+'s cubic-bezier(.45,0,.25,1) 1 both}'+
'.wbk{z-index:0}.wfr{z-index:2}.wst{z-index:1}';
var html='';
for(var i=0;i<N;i++){
  var c=(i+.5)*h,d=(c-S/2)/(S/2),s=prof(d),j=(i%3-1)*0.07*(1-Math.abs(d)),w=1+ (i%2?0.012:-0.008);
  var sm=1-(1-s)*0.55, dl=(Math.abs(d)*0.05).toFixed(3);
  css+='@keyframes wp'+i+'{0%{transform:translateX(0) scaleX(1)}100%{transform:translateX('+j.toFixed(2)+'px) scaleX('+(s*w).toFixed(4)+')}}'+
  '.wst.s'+i+'{top:'+(i*h-.35).toFixed(2)+'px;height:'+(h+.7).toFixed(2)+'px;background-position:0 '+(-(i*h-.35)).toFixed(2)+'px;animation-name:wp'+i+';animation-delay:'+(T!=null?(-T+ +dl):dl)+'s;transform:scaleX('+sm.toFixed(4)+')}';
  html+='<div class="wst s'+i+'"></div>';
}
/* wire squeeze tracks the centre strip (slightly tighter so it digs in) */
var wmin=MIN*0.96, wmid=1-(1-wmin)*0.55;
css+='@keyframes wwc{0%{transform:scale(1,1)}100%{transform:scale('+wmin.toFixed(4)+',.94)}}'+
'.wwr{animation-name:wwc;animation-delay:'+(T!=null?-T:0)+'s;transform:scale('+wmid.toFixed(4)+',.97)}';
if(T!=null)css+='.wst,.wwr{animation-play-state:paused!important}';
css+='@media (prefers-reduced-motion:reduce){.wst,.wwr{animation:none!important}}';
/* barbed wire geometry: two coils (tilted ellipses), each a twisted double strand + X barbs */
var RX=68,RY=10,TURNS=2,DR=22,P=Math.PI;
function pt(t){var x=RX*Math.cos(t),y=RY*Math.sin(t)+DR*(t/(2*P*TURNS)-.5)+1.2*Math.sin(t*1.7);return [100+x,40+y];}
function tan(t){var a=pt(t),b=pt(t+.01),tx=b[0]-a[0],ty=b[1]-a[1],L=Math.hypot(tx,ty)||1;return [tx/L,ty/L];}
function seg(t0,t1){var n=Math.max(8,Math.round((t1-t0)*60)),A=[],B=[];
  for(var k=0;k<=n;k++){var t=t0+(t1-t0)*k/n,p=pt(t),u=tan(t),o=1.05*Math.sin(t*30);
    A.push((p[0]-u[1]*o).toFixed(2)+','+(p[1]+u[0]*o).toFixed(2));B.push((p[0]+u[1]*o).toFixed(2)+','+(p[1]-u[0]*o).toFixed(2));}
  return ['M'+A.join('L'),'M'+B.join('L')];}
function barb(t){var p=pt(t),u=tan(t),d='';
  [[42,9],[-42,9]].forEach(function(b){var a=b[0]*P/180,ux=u[0]*Math.cos(a)-u[1]*Math.sin(a),uy=u[0]*Math.sin(a)+u[1]*Math.cos(a);
    d+='M'+(p[0]-ux*b[1]).toFixed(2)+','+(p[1]-uy*b[1]).toFixed(2)+'L'+(p[0]+ux*b[1]).toFixed(2)+','+(p[1]+uy*b[1]).toFixed(2);});
  return d+'M'+(p[0]-u[0]*2.6).toFixed(2)+','+(p[1]-u[1]*2.6).toFixed(2)+'L'+(p[0]+u[0]*2.6).toFixed(2)+','+(p[1]+u[1]*2.6).toFixed(2);}
function layer(front){var w='',w2='',b='',end=2*P*TURNS;
  for(var t0=0;t0<end;t0+=P){var isF=Math.sin(t0+P/2)>0;if(isF!==front)continue;var a=Math.max(0,t0-.05),z=Math.min(end,t0+P+.05);var sg=seg(a,z);w+=sg[0];w2+=sg[1];}
  for(var bt=0.35;bt<end;bt+=P/3.6){if((Math.sin(bt)>0)===front)b+=barb(bt);}
  var lc=front?'#EEEEF0':'#7E7E86',oc='#000',s='<path d="'+w+w2+'" fill="none" stroke="'+oc+'" stroke-width="'+(front?3.8:3)+'" stroke-linecap="round" stroke-linejoin="round"/>'+
   '<path d="'+b+'" fill="none" stroke="'+oc+'" stroke-width="'+(front?3.4:2.8)+'" stroke-linecap="round"/>'+
   '<path d="'+w2+'" fill="none" stroke="'+(front?'#A9A9B0':'#5E5E66')+'" stroke-width="'+(front?1.6:1.2)+'" stroke-linecap="round"/>'+'<path d="'+w+'" fill="none" stroke="'+lc+'" stroke-width="'+(front?1.6:1.2)+'" stroke-linecap="round"/>'+
   '<path d="'+b+'" fill="none" stroke="'+lc+'" stroke-width="'+(front?1.3:1)+'" stroke-linecap="butt"/>';
  return '<svg class="wwr '+(front?'wfr':'wbk')+'" viewBox="0 0 200 80" aria-hidden="true">'+s+'</svg>';}
var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
host.insertAdjacentHTML('beforeend',layer(false)+html+layer(true));
})();
</script>
<div id="gate"><img src="icon.png" alt="MQ"><p>The dashboard didn't load here. Open it directly instead.</p><a href="https://script.google.com/macros/s/AKfycbx8XWIiHerhRll_alm0B5ziQAN3TGxC3PLDVp5RCyq9PqcS3odJ64XV5-2cneIHVe5mLg/exec" target="_top">Open dashboard</a></div>
<script>

(function(){var t0=Date.now(),alive=false,done=false,sp=document.getElementById('splash');
function hide(){if(done)return;done=true;setTimeout(function(){sp.classList.add('out');setTimeout(function(){sp.style.display='none';},500);},Math.max(0,1900-(Date.now()-t0)));}
addEventListener('message',function(e){var m=e.data&&e.data.mq;if(!m)return;if(m==='alive'||m==='ready'){alive=true;document.getElementById('gate').classList.remove('show');}if(m==='ready')hide();});
setTimeout(function(){if(!alive){document.getElementById('gate').classList.add('show');hide();}},9000);
setTimeout(hide,30000);})();
</script></body></html>
