<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MQ</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MQ"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0B0C"><link rel="apple-touch-icon" sizes="180x180" href="icon.png"><link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--hdr:#111113;--tx:#FFFFFF;--mut:#9A9AA0;--ac:#E0A43A}
html,body{margin:0;height:100%;background:var(--hdr);touch-action:manipulation;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--tx)}
/* full-bleed frame inset by the safe areas (env() is 0 inside the iframe, so the outer page pads) */
#app{position:fixed;top:env(safe-area-inset-top);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));border:0;background:var(--bg);touch-action:manipulation}
#splash{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px max(28px,env(safe-area-inset-right)) 32px max(28px,env(safe-area-inset-left));transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;animation:pulse 2.2s ease-in-out infinite}
.bar{width:140px;height:3px;border-radius:3px;background:#202024;overflow:hidden;margin:26px 0 24px}.bar i{display:block;width:40%;height:100%;background:var(--ac);border-radius:3px;animation:slide 1.3s ease-in-out infinite}
#q{color:var(--tx);font-size:19px;font-weight:600;line-height:1.4;max-width:420px;margin:0 0 10px;letter-spacing:-.01em}#a{color:var(--mut);font-size:13px;margin:0;letter-spacing:.04em}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.035);opacity:.88}}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#splash img,.bar i{animation:none}}
#gate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);padding:24px;text-align:center;z-index:6}
#gate.show{display:flex}#gate img{width:120px;height:120px}#gate p{color:var(--mut);margin:0;max-width:300px;font-size:15px;line-height:1.45}
#gate a{background:var(--ac);color:#000;font-weight:700;font-size:17px;text-decoration:none;border-radius:12px;padding:14px 28px;min-height:44px;box-sizing:border-box}
</style>
</head><body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbx8XWIiHerhRll_alm0B5ziQAN3TGxC3PLDVp5RCyq9PqcS3odJ64XV5-2cneIHVe5mLg/exec" allow="clipboard-write" title="MQ 2027 Master Dashboard"></iframe>
<div id="splash" role="status" aria-label="Loading"><img src="logo.png" alt="MQ"><div class="bar"><i></i></div><p id="q"></p><p id="a"></p></div>
<div id="gate"><img src="icon.png" alt="MQ"><p>The dashboard didn't load here. Open it directly instead.</p><a href="https://script.google.com/macros/s/AKfycbx8XWIiHerhRll_alm0B5ziQAN3TGxC3PLDVp5RCyq9PqcS3odJ64XV5-2cneIHVe5mLg/exec" target="_top">Open dashboard</a></div>
<script>
var MQ_QUOTES=[["The harder I work, the luckier I get.","Samuel Goldwyn (attributed)"],
["Discipline equals freedom.","Jocko Willink"],
["The best way out is always through.","Robert Frost"],
["Well done is better than well said.","Benjamin Franklin"],
["Fortune favors the bold.","Virgil"],
["Do or do not. There is no try.","Yoda"],
["Everybody has a plan until they get punched in the mouth.","Mike Tyson"],
["Hard work beats talent when talent doesn't work hard.","Tim Notke"],
["Stay hungry. Stay foolish.","Steve Jobs"],
["Done is better than perfect.","Sheryl Sandberg"],
["You miss 100% of the shots you don't take.","Wayne Gretzky"],
["Float like a butterfly, sting like a bee.","Muhammad Ali"],
["I am the master of my fate, I am the captain of my soul.","William Ernest Henley"],
["The impediment to action advances action. What stands in the way becomes the way.","Marcus Aurelius"],
["No man is free who is not master of himself.","Epictetus"],
["Begin at once to live.","Seneca"],
["We are what we repeatedly do.","Will Durant"],
["Courage is grace under pressure.","Ernest Hemingway"],
["Be so good they can't ignore you.","Steve Martin"],
["Pressure is a privilege.","Billie Jean King"],
["Champions keep playing until they get it right.","Billie Jean King"],
["The only easy day was yesterday.","U.S. Navy SEALs"],
["What we do in life echoes in eternity.","Maximus, Gladiator"],
["The best time to plant a tree was 20 years ago. The second best time is now.","Chinese proverb"],
["It always seems impossible until it's done.","Nelson Mandela (attributed)"],
["Whether you think you can, or you think you can't, you're right.","Henry Ford (attributed)"],
["If you're going through hell, keep going.","Winston Churchill (attributed)"],
["Luck is what happens when preparation meets opportunity.","Seneca (attributed)"],
["Don't count the days. Make the days count.","Muhammad Ali (attributed)"],
["Nothing will work unless you do.","Maya Angelou (attributed)"],
["Victory belongs to the most persevering.","Napoleon Bonaparte (attributed)"],
["Inspiration exists, but it has to find you working.","Pablo Picasso (attributed)"],
["It's not the size of the dog in the fight, it's the size of the fight in the dog.","Mark Twain (attributed)"],
["The way to get started is to quit talking and begin doing.","Walt Disney (attributed)"],
["The man who moves a mountain begins by carrying away small stones.","Confucius (attributed)"],
["Action is the foundational key to all success.","Pablo Picasso (attributed)"]];
(function(){var t0=Date.now(),alive=false,done=false,sp=document.getElementById('splash');
var x=MQ_QUOTES[Math.floor(Math.random()*MQ_QUOTES.length)];document.getElementById('q').textContent='\u201C'+x[0]+'\u201D';document.getElementById('a').textContent=x[1];
function hide(){if(done)return;done=true;setTimeout(function(){sp.classList.add('out');setTimeout(function(){sp.style.display='none';},500);},Math.max(0,1200-(Date.now()-t0)));}
addEventListener('message',function(e){var m=e.data&&e.data.mq;if(!m)return;if(m==='alive'||m==='ready'){alive=true;document.getElementById('gate').classList.remove('show');}if(m==='ready')hide();});
setTimeout(function(){if(!alive){document.getElementById('gate').classList.add('show');hide();}},9000);
setTimeout(hide,30000);})();
</script></body></html>
